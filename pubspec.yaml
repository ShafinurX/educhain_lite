name: educhain_lite
description: EduChain Lite - Secure Student Digital Profile & Verification System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  http: ^1.2.0


  crypto: ^3.0.3


  qr_flutter: ^4.1.0


  mobile_scanner: ^3.2.0


  file_picker: ^8.0.0+1


  flutter_secure_storage: ^9.0.0


  shared_preferences: ^2.2.3


  cupertino_icons: ^1.0.6


  flutter_spinkit: ^5.2.1




  cached_network_image: ^3.3.1


  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.17